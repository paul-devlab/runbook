{% extends "base.html" %}
{# A separate "are you sure?" page works without JavaScript. #}

{% block content %}
  <section class="card narrow">
    <h1>Delete file?</h1>
    <p>“{{ attachment.filename }}” will be deleted. This can't be undone.</p>
    <form method="post" action="/attachments/{{ attachment.id }}/delete">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="actions">
        <button type="submit" class="danger">Delete</button>
        <a href="{{ back_url }}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
