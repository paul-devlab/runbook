{% extends "base.html" %}

{% block content %}
  <section class="card narrow">
    <h1>Log in</h1>

    {% if error %}
      <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    {# A plain HTML form: works without JavaScript. #}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username"
             value="{{ email or '' }}" maxlength="320" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" maxlength="256" required>

      <button type="submit">Log in</button>
    </form>

    <p class="muted">Accounts are created by an admin. There's no sign-up.</p>
  </section>
{% endblock %}
