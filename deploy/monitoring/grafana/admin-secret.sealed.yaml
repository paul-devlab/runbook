# Grafana's admin login for staging, encrypted with this cluster's Sealed Secrets key.
# Only the controller in the cluster can decrypt it into the Secret "grafana-admin".
# To change the password: seal a new one the same way (docs/staging.md §11), keep the sync-wave
# annotation below, and deploy; Grafana picks it up when it restarts.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # create the Secret before Grafana starts
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
