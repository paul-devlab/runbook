# Grafana's dashboards and admin login, deployed by the Argo CD Application
# "grafana" alongside the chart (deploy/argocd/application-grafana.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - admin-secret.sealed.yaml

# One ConfigMap holding every dashboard file. Grafana mounts it and loads the
# files; edits reach Grafana within about a minute of Argo CD syncing.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/runbook.json
      - dashboards/staging-pi.json
generatorOptions:
  # Keep the name fixed ("grafana-dashboards"), as the Grafana values refer to it.
  disableNameSuffixHash: true
