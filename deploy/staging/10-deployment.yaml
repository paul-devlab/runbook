# A Deployment keeps the requested number of app containers (pods) running,
# replaces them if they crash, and rolls out new versions one step at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runbook
  namespace: runbook
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after Postgres (-1) and migrations (0)
  labels:
    app.kubernetes.io/name: runbook
    app.kubernetes.io/part-of: runbook
spec:
  replicas: 1
  revisionHistoryLimit: 3 # keep a few old versions around for `kubectl rollout undo`
  # Rollouts: start the new pod first (maxSurge 1) and only stop the old one
  # once the new one is ready (maxUnavailable 0), so there's always a pod
  # serving. (The defaults do the same for one replica, but only via rounding.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: runbook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runbook
        app.kubernetes.io/part-of: runbook
      # Tell Prometheus (deploy/monitoring/) to scrape this pod's metrics port.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      # The app never talks to the Kubernetes API, so don't give it a token.
      automountServiceAccountToken: false
      # Time allowed to stop: the 5s preStop pause below, then up to 25s for
      # Uvicorn to finish requests already in progress. (30s is the default;
      # it's written out so the numbers can be read together.)
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # the "app" user created in the Dockerfile
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault # block unusual system calls
      containers:
        - name: app
          # Tag set in kustomization.yaml (one place for the app and the migration Job).
          image: ghcr.io/paul-devlab/runbook
          ports:
            - name: http
              containerPort: 8000
            # Prometheus metrics (app/metrics.py). Not in the Service or Ingress,
            # so only reachable from inside the cluster.
            - name: metrics
              containerPort: 9000
          # Database settings, read by app/config.py. The password comes from the
          # Secret the SealedSecret in 05-db-secret.sealed.yaml creates.
          env:
            - name: POSTGRES_HOST
              value: postgres # the Service in 06-postgres.yaml
            - name: POSTGRES_USER
              value: runbook
            - name: POSTGRES_DB
              value: runbook
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runbook-db
                  key: POSTGRES_PASSWORD
            # Staging is plain HTTP for now, and browsers never send Secure
            # cookies over HTTP, so logins would silently fail. Remove this
            # (back to the safe default, true) once staging has TLS.
            - name: SESSION_COOKIE_SECURE
              value: "false"
            # Requests arrive via Traefik, so the app sees Traefik's address,
            # not the browser's. Uvicorn uses the X-Forwarded-For header
            # instead, but only from these addresses: k3s's pod network, where
            # Traefik runs. (Login rate limiting counts failures per IP.)
            - name: FORWARDED_ALLOW_IPS
              value: "10.42.0.0/16"
            # Ask (app/ask.py): the Claude API key, from the SealedSecret in
            # 07-anthropic-secret.sealed.yaml. The model can be changed here.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runbook-anthropic
                  key: ANTHROPIC_API_KEY
            - name: ANTHROPIC_MODEL
              value: claude-opus-5-5
          # Avoid errors during rollouts. When a pod is told to stop, Kubernetes
          # also tells Traefik to stop sending it traffic, but both happen at
          # once and Traefik takes a moment to catch up. Without a pause, the
          # app could stop while Traefik still sends it requests (a 502).
          # The pause keeps it serving for 5s while Traefik switches over;
          # then Uvicorn gets SIGTERM and shuts down cleanly.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The root filesystem is read-only, but uploads over 1 MB are saved
          # to /tmp while they're being received.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Requests: what the scheduler reserves for the pod. Limit: the most
          # memory it may use before it's restarted. It uses ~85 MiB today.
          # No CPU limit on purpose: it would throttle the app even when the
          # Pi has CPU to spare.
          resources:
            requests:
              cpu: 50m # 5% of one CPU core
              memory: 128Mi
            limits:
              memory: 256Mi
          # Startup: give the app up to 60s to start before the other checks begin.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Liveness: if /health stops answering, restart the container.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: only send traffic while this passes. /ready checks the
          # database, so if Postgres is down the app stops getting traffic (but
          # isn't restarted, which wouldn't help).
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi # room for several 10 MB uploads at once
