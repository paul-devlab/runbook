# Database migrations: runs `alembic upgrade head` with the app's own image,
# after Postgres is up and before the new app version starts.
#
# It's an Argo CD "hook": Argo CD creates this Job during every sync and waits
# for it to finish. If the migration fails, the sync stops and the old app
# version keeps running. Running it again when there's nothing to do is a no-op.
#
# Order within a sync (sync waves): -1 Postgres + its password, 0 this Job,
# 1 the app. Argo CD waits for each wave to be healthy before the next.
apiVersion: batch/v1
kind: Job
metadata:
  name: runbook-migrate
  namespace: runbook
  labels:
    app.kubernetes.io/name: runbook-migrate
    app.kubernetes.io/part-of: runbook
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    # Delete the previous run's Job just before creating the next one, so the
    # last run (and its logs) stays around for inspection.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2 # retry up to twice (e.g. Postgres still starting)
  activeDeadlineSeconds: 600 # give up after 10 minutes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runbook-migrate
        app.kubernetes.io/part-of: runbook
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/paul-devlab/runbook # tag set in kustomization.yaml
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_USER
              value: runbook
            - name: POSTGRES_DB
              value: runbook
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runbook-db
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
