# Postgres password for staging, encrypted with this cluster's Sealed Secrets key.
# Only the controller in the cluster can decrypt it into the Secret "runbook-db".
# To rotate: see docs/staging.md §8 ("Sealing a secret"), then restart Postgres and the app.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: runbook-db
  namespace: runbook
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: runbook-db
      namespace: runbook
