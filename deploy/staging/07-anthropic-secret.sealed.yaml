# Anthropic API key for staging, encrypted with this cluster's Sealed Secrets key.
# Only the controller in the cluster can decrypt it into the Secret "runbook-anthropic".
# To rotate: create a new key in the Console, run the sealing script again, deploy.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before the app needs it
  name: runbook-anthropic
  namespace: runbook
spec:
  encryptedData:
    ANTHROPIC_API_KEY: 
  template:
    metadata:
      name: runbook-anthropic
      namespace: runbook
