# Argo CD deploys the Sealed Secrets controller from deploy/sealed-secrets/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  # No resources finalizer on purpose: deleting this Application should NOT
  # delete the controller, its private key or the SealedSecret CRD (which would
  # delete every SealedSecret in the cluster).
spec:
  project: default
  source:
    repoURL: https://github.com/paul-devlab/runbook.git
    targetRevision: main
    path: deploy/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # No prune: never let a Git mistake delete the CRD (and with it every
      # SealedSecret). Removing things from this app is done deliberately.
      prune: false
      selfHeal: true
