# Build the production container image for linux/amd64 and linux/arm64.
#
#   Pull request:   build both architectures, but don't publish (proves it builds).
#   Push to main:   build both and publish to GHCR as ghcr.io/<owner>/runbook.
#
# Tags published (never `latest`, so deployments can pin an exact build):
#   sha-<full commit SHA>   one per commit; this is what deployments should use
#   main                    moves to the newest build of main

name: Image

on:
  pull_request:
  push:
    branches: [main]

# Default for the whole workflow: read-only. The job below asks for more.
permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR image names must be lowercase; github.repository is "owner/name".
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # arm64 is built under emulation (QEMU), which is slow.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # needed to push to GHCR (only used on main)

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU lets this amd64 runner run arm64 programs (slowly), so the arm64
      # half of the image can be built here.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3 # pinned; the default is :latest
          platforms: arm64

      # Buildx is Docker's builder that can build several architectures at once.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1 # pinned; the default is a moving tag

      # Only log in when we're going to push. GITHUB_TOKEN is a short-lived
      # token GitHub creates for each run; no secret needs to be set up.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the tags and the standard OCI labels (source repo, commit,
      # created time). The source label links the package to this repo on GitHub.
      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime # the production stage of the Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers from earlier runs (stored in GitHub's cache),
          # so most builds skip the slow dependency-install step.
          cache-from: type=gha
          cache-to: type=gha,mode=max
